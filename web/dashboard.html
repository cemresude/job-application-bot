<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Başvuru Botu — Kontrol Paneli</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --border:#e4e7ec;
    --text:#1a1f2b; --muted:#697386; --brand:#3b5bdb; --brand-weak:#e8edfb;
    --green:#1f9d55; --green-bg:#e6f6ec; --amber:#b7791f; --amber-bg:#fdf3e0;
    --red:#c0392b; --red-bg:#fbe9e7; --gray:#5b6472; --gray-bg:#eef0f3;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --panel:#161b24; --panel-2:#1b212c; --border:#28303d;
      --text:#e8ebf0; --muted:#95a0b3; --brand:#7f9cf5; --brand-weak:#1e2740;
      --green:#4ade80; --green-bg:#12301f; --amber:#f0b95a; --amber-bg:#33270f;
      --red:#f08a7e; --red-bg:#361a17; --gray:#9aa4b2; --gray-bg:#222833;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand); text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1160px; margin:0 auto; padding:22px 20px 60px}

  header{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
  .title h1{font-size:21px; margin:0; letter-spacing:-.02em}
  .title p{margin:3px 0 0; color:var(--muted); font-size:13px}
  .head-actions{display:flex; align-items:center; gap:10px}
  .btn{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    padding:8px 13px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow);
  }
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand); color:#fff; border-color:var(--brand)}
  .updated{color:var(--muted); font-size:12px}

  /* Stat kartları */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 15px; box-shadow:var(--shadow); cursor:pointer; transition:transform .08s, border-color .12s;
    position:relative; overflow:hidden;
  }
  .card:hover{transform:translateY(-2px); border-color:var(--brand)}
  .card.active{border-color:var(--brand); box-shadow:0 0 0 2px var(--brand-weak)}
  .card .k{font-size:12px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px}
  .card .v{font-size:27px; font-weight:750; margin-top:6px; letter-spacing:-.02em}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block}
  .dot.green{background:var(--green)} .dot.amber{background:var(--amber)}
  .dot.red{background:var(--red)} .dot.gray{background:var(--gray)} .dot.brand{background:var(--brand)}

  /* Filtre çubuğu */
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .search{flex:1 1 240px; position:relative}
  .search input{
    width:100%; padding:9px 12px 9px 34px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:13.5px;
  }
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5}
  select{
    padding:9px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:13.5px; font-weight:500;
  }
  .toggle{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; font-weight:600}
  .toggle input{accent-color:var(--brand); width:16px; height:16px; cursor:pointer}
  input,select,button{font-family:inherit}
  input:focus,select:focus{outline:2px solid var(--brand-weak); outline-offset:0; border-color:var(--brand)}

  .resultline{font-size:12.5px; color:var(--muted); margin:0 2px 10px}

  /* Tablo */
  .tablewrap{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:720px}
  thead th{
    text-align:left; padding:11px 14px; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--muted); border-bottom:1px solid var(--border); background:var(--panel-2); position:sticky; top:0; cursor:pointer; white-space:nowrap;
  }
  thead th:hover{color:var(--text)}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-2)}
  tr.manual{box-shadow:inset 3px 0 0 var(--amber)}
  tr.applied{box-shadow:inset 3px 0 0 var(--green)}
  .jtitle{font-weight:650; color:var(--text)}
  .jtitle a{color:var(--text)}
  .jtitle a:hover{color:var(--brand)}
  .jcompany{color:var(--muted); font-size:12.5px; margin-top:2px}
  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
    font-size:11.5px; font-weight:700; white-space:nowrap;
  }
  .pill.green{background:var(--green-bg); color:var(--green)}
  .pill.amber{background:var(--amber-bg); color:var(--amber)}
  .pill.red{background:var(--red-bg); color:var(--red)}
  .pill.gray{background:var(--gray-bg); color:var(--gray)}
  .plat{display:inline-block; padding:2px 8px; border-radius:6px; background:var(--brand-weak); color:var(--brand); font-weight:700; font-size:11.5px; white-space:nowrap}
  .note{color:var(--muted); font-size:12px; margin-top:3px; max-width:340px}
  .date{color:var(--muted); font-size:12.5px; white-space:nowrap}
  .seen{display:inline-block; margin-left:6px; font-size:10.5px; color:var(--muted); background:var(--gray-bg); border-radius:5px; padding:1px 5px}
  .ext{opacity:.55; font-size:11px}

  .empty{padding:56px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-size:34px; margin-bottom:8px}
  footer{margin-top:22px; color:var(--muted); font-size:12px; text-align:center}
  .banner{background:var(--amber-bg); color:var(--amber); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px; font-weight:600}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>🤖 Başvuru Botu — Kontrol Paneli</h1>
      <p>Botun bulduğu ilanlar, başvuru durumları ve <b>başvurulmama nedenleri</b></p>
    </div>
    <div class="head-actions">
      <span class="updated" id="updated"></span>
      <button class="btn primary" id="refresh">↻ Yenile</button>
    </div>
  </header>

  <div id="scanbanner" class="banner hide"></div>

  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Pozisyon veya şirket ara…">
    </label>
    <select id="platform"><option value="">Tüm platformlar</option></select>
    <select id="category">
      <option value="">Tüm durumlar</option>
      <option value="applied">Başvuruldu</option>
      <option value="no_easy_apply">Kolay başvuru yok</option>
      <option value="form_failed">Form doldurulamadı</option>
      <option value="low_match">Düşük uyum</option>
      <option value="other">Diğer</option>
    </select>
    <label class="toggle"><input type="checkbox" id="manualOnly"> Sadece manuel başvurulabilir</label>
  </div>

  <p class="resultline" id="resultline"></p>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th data-sort="platform">Platform</th>
          <th data-sort="title">Pozisyon</th>
          <th data-sort="category">Durum / Neden</th>
          <th data-sort="date">Tarih</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hide" id="empty">
      <div class="big">🔍</div>
      <div>Bu filtreye uyan ilan yok.</div>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const PILL = {
  applied:       {cls:"green", label:"Başvuruldu"},
  no_easy_apply: {cls:"amber", label:"Kolay başvuru yok"},
  form_failed:   {cls:"red",   label:"Form doldurulamadı"},
  low_match:     {cls:"gray",  label:"Düşük uyum"},
  other:         {cls:"gray",  label:"Diğer"},
};
const CARDS = [
  {key:"unique",        label:"Toplam ilan",        dot:"brand", cat:""},
  {key:"applied",       label:"Başvurulan",         dot:"green", cat:"applied"},
  {key:"manual",        label:"Manuel başvurulabilir", dot:"amber", cat:"__manual"},
  {key:"no_easy_apply", label:"Kolay başvuru yok",  dot:"amber", cat:"no_easy_apply"},
  {key:"form_failed",   label:"Form doldurulamadı", dot:"red",   cat:"form_failed"},
  {key:"low_match",     label:"Düşük uyum",         dot:"gray",  cat:"low_match"},
];

let DATA = {jobs:[], stats:{}, platforms:[]};
let sortKey = "date", sortDir = -1;

const el = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return iso.slice(0,10);
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"}) +
         " · " + d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}

async function load(){
  el("refresh").textContent = "↻ Yükleniyor…";
  try{
    const res = await fetch("/api/applications", {cache:"no-store"});
    DATA = await res.json();
  }catch(e){
    el("rows").innerHTML = `<tr><td colspan="4" style="color:var(--red);padding:20px">Veri alınamadı: ${esc(e.message)}</td></tr>`;
    return;
  }finally{
    el("refresh").textContent = "↻ Yenile";
  }
  el("updated").textContent = "Güncellendi: " + fmtDate(DATA.generated_at);

  // Tarama bilgisi
  const s = DATA.stats;
  el("scanbanner").classList.toggle("hide", !s.scans);
  el("scanbanner").textContent =
    `Bot toplam ${s.scans} tarama yaptı → ${s.unique} benzersiz ilan. ` +
    `${s.manual} tanesi eşleşti ama otomatik başvurulamadı (manuel başvurulabilir).`;

  buildCards();
  buildPlatformOptions();
  render();
}

function buildCards(){
  const s = DATA.stats;
  el("cards").innerHTML = CARDS.map(c => `
    <div class="card" data-cat="${c.cat}">
      <div class="k"><span class="dot ${c.dot}"></span>${c.label}</div>
      <div class="v">${s[c.key] ?? 0}</div>
    </div>`).join("");
  el("cards").querySelectorAll(".card").forEach(card => {
    card.onclick = () => {
      const cat = card.dataset.cat;
      if(cat === "__manual"){
        el("manualOnly").checked = !el("manualOnly").checked;
        el("category").value = "";
      }else{
        el("category").value = cat;
        el("manualOnly").checked = false;
      }
      render();
    };
  });
}

function buildPlatformOptions(){
  const sel = el("platform"), cur = sel.value;
  sel.innerHTML = `<option value="">Tüm platformlar</option>` +
    DATA.platforms.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  sel.value = cur;
}

function currentFilters(){
  return {
    q: el("q").value.trim().toLowerCase(),
    platform: el("platform").value,
    category: el("category").value,
    manualOnly: el("manualOnly").checked,
  };
}

function filtered(){
  const f = currentFilters();
  return DATA.jobs.filter(j => {
    if(f.platform && j.platform !== f.platform) return false;
    if(f.category && j.category !== f.category) return false;
    if(f.manualOnly && !j.manual) return false;
    if(f.q){
      const hay = (j.title + " " + j.company + " " + j.note + " " + j.platform).toLowerCase();
      if(!hay.includes(f.q)) return false;
    }
    return true;
  });
}

function sortJobs(list){
  const dir = sortDir;
  return [...list].sort((a,b) => {
    let x = a[sortKey] ?? "", y = b[sortKey] ?? "";
    x = ("" + x).toLowerCase(); y = ("" + y).toLowerCase();
    return x < y ? -dir : x > y ? dir : 0;
  });
}

function render(){
  const f = currentFilters();
  // Aktif kart vurgusu
  el("cards").querySelectorAll(".card").forEach(card => {
    const cat = card.dataset.cat;
    const active = cat === "__manual" ? f.manualOnly : (cat && cat === f.category);
    card.classList.toggle("active", !!active);
  });

  const list = sortJobs(filtered());
  const rows = el("rows"), empty = el("empty");

  if(!list.length){
    rows.innerHTML = "";
    empty.classList.remove("hide");
  }else{
    empty.classList.add("hide");
    rows.innerHTML = list.map(j => {
      const p = PILL[j.category] || PILL.other;
      const cls = j.category === "applied" ? "applied" : (j.manual ? "manual" : "");
      const titleHtml = j.url
        ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)} <span class="ext">↗</span></a>`
        : esc(j.title);
      const seen = j.seen_count > 1 ? `<span class="seen" title="Bu ilan ${j.seen_count} kez tarandı">${j.seen_count}×</span>` : "";
      const note = (j.note && j.note !== p.label) ? `<div class="note">${esc(j.note)}</div>` : "";
      return `<tr class="${cls}">
        <td><span class="plat">${esc(j.platform)}</span></td>
        <td>
          <div class="jtitle">${titleHtml}${seen}</div>
          <div class="jcompany">${esc(j.company)}</div>
        </td>
        <td><span class="pill ${p.cls}">${esc(j.category_label || p.label)}</span>${note}</td>
        <td class="date">${fmtDate(j.date)}</td>
      </tr>`;
    }).join("");
  }

  const total = DATA.jobs.length;
  el("resultline").textContent = `${list.length} ilan gösteriliyor (${total} benzersiz ilandan)`;
  el("footer").textContent =
    `başvuru-otomatik · ${DATA.stats.scans||0} tarama · ${total} benzersiz ilan · ` +
    `${DATA.stats.applied||0} başvuru · ${DATA.stats.skipped||0} başvurulmadı`;
}

// Olaylar
el("refresh").onclick = load;
["q","platform","category","manualOnly"].forEach(id => {
  el(id).addEventListener("input", render);
  el(id).addEventListener("change", render);
});
document.querySelectorAll("thead th").forEach(th => {
  th.onclick = () => {
    const k = th.dataset.sort;
    if(sortKey === k){ sortDir *= -1; } else { sortKey = k; sortDir = (k==="date") ? -1 : 1; }
    render();
  };
});

load();
</script>
</body>
</html>
